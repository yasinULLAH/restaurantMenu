name: Build Offline APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/restaurant-menu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-menu-apk
          path: release-apk/restaurant-menu.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest Offline APK
          files: release-apk/restaurant-menu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
